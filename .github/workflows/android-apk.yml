name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync to Android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "AlienKada-${TAG:-dev}-debug.apk"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: alien-kada-apk
          path: AlienKada-*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" AlienKada-*.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
